databases:
  - name: cvmatch-db
    plan: free
    databaseName: cvmatch
    user: cvmatch

services:
  - type: web
    name: cvmatch
    env: python
    plan: free
    # No persistent disk on the free plan -- uploaded CVs/generated docs
    # live on the service's ephemeral filesystem and don't survive a
    # restart or redeploy. Fine for testing the account/billing/webhook
    # flow now; revisit with a Starter-plan disk (see git history for the
    # prior version of this file) once there's budget and real users
    # whose uploaded files need to actually persist.
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cvmatch-db
          property: connectionString
      - key: FLASK_SECRET
        generateValue: true
      - key: PAYFAST_SANDBOX
        value: "true" # flip to "false" only once testing has fully passed and live PayFast credentials are in place below
      - key: PAYFAST_PRO_PRICE_ZAR
        value: "99.00"
      # Filled in via the Render dashboard, never committed to the repo:
      - key: GROQ_API_KEY
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
