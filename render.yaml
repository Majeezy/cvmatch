databases:
  - name: job-application-assistant-db
    plan: free
    databaseName: job_app_assistant
    user: job_app_assistant

services:
  - type: web
    name: job-application-assistant
    env: python
    plan: starter # persistent disks require Starter or above, not the free plan
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    disk:
      name: job-app-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: job-application-assistant-db
          property: connectionString
      - key: FLASK_SECRET
        generateValue: true
      # Filled in via the Render dashboard, never committed to the repo:
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
