databases:
  - name: orbital-careers-db
    plan: free
    databaseName: orbital_careers
    user: orbital_careers

services:
  - type: web
    name: orbital-careers
    env: python
    plan: starter # persistent disks require Starter or above, not the free plan
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    disk:
      name: orbital-careers-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: orbital-careers-db
          property: connectionString
      - key: FLASK_SECRET
        generateValue: true
      - key: PAYFAST_SANDBOX
        value: "false" # flip only once live PayFast credentials are actually in place below
      - key: PAYFAST_PRO_PRICE_ZAR
        value: "99.00"
      # Filled in via the Render dashboard, never committed to the repo:
      - key: GROQ_API_KEY
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
